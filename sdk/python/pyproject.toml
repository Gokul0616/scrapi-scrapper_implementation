[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapi-sdk"
version = "1.0.0"
description = "Python SDK for the Scrapi web scraping platform — Scrapi-compatible interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

keywords = ["scraping", "web-scraping", "scrapi", "sdk", "scrapi-compatible"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://scrapi.io"
Repository = "https://github.com/scrapi-io/scrapi-sdk-python"
Documentation = "https://docs.scrapi.io/sdk/python"
