version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: scrapi_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: scrapi_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrapi_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - DB_NAME=scrapi
    depends_on:
      - mongodb
      - redis
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker-premium:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrapi_worker_premium
    volumes:
      - ./backend:/app
    environment: &worker_env
      MONGO_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
      DB_NAME: scrapi
    depends_on:
      - mongodb
      - redis
    command: celery -A celery_app worker -Q celery,q_premium,q_priority -c 10 --loglevel=info
    deploy:
      mode: replicated
      replicas: 2
    restart: unless-stopped

  worker-standard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrapi_worker_standard
    volumes:
      - ./backend:/app
    environment: *worker_env
    depends_on:
      - mongodb
      - redis
    command: celery -A celery_app worker -Q q_standard,q_scheduled,q_webhooks -c 4 --loglevel=info
    deploy:
      mode: replicated
      replicas: 3
    restart: unless-stopped

  worker-free:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrapi_worker_free
    volumes:
      - ./backend:/app
    environment: *worker_env
    depends_on:
      - mongodb
      - redis
    command: celery -A celery_app worker -Q q_free -c 1 --loglevel=info
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrapi_celery_beat
    volumes:
      - ./backend:/app
    environment: *worker_env
    depends_on:
      - redis
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped

  flower:
    image: mher/flower
    container_name: scrapi_flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - worker-standard
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scrapi_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
